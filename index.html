<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAX Resident</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            color: #1E293B;
            background: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 520px;
            text-align: center;
            padding: 48px 24px;

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #2563EB;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 18px;
            color: #64748B;
            margin-bottom: 32px;
        }
        .description {
            font-size: 16px;
            color: #475569;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s;
        }
        .links a.primary {
            background: #2563EB;
            color: white;
        }
        .links a.primary:hover {
            background: #1D4ED8;
        }
        .links a.secondary {
            background: #F1F5F9;
            color: #334155;
            border: 1px solid #E2E8F0;
        }
        .links a.secondary:hover {
            background: #E2E8F0;
